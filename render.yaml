services:
  - type: web
    name: sita-clienti-mongo
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: test
      - key: COLLECTION_NAME
        value: Clienti maro/rosu
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
